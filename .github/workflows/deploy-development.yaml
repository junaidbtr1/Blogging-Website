name: Deploy to Development

on:
  push:
    branches: [ develop ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        # For Next.js static sites replace with:
        # run: |
        #   npm run build
        #   npx next export -o out

      - name: Verify build output
        run: |
          echo "PWD: $(pwd)"
          ls -la
          echo "Contents of ./dist (if any):"
          ls -la ./dist || true
          du -sh ./dist || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist    # change to ./build or ./out if that’s your output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # If you changed the artifact name in the upload step, pass it here:
        # with:
        #   artifact_name: my-pages-artifact
